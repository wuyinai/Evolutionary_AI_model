server:
  port: 8234

spring:
  application:
    name: Evolutionary_AI_model
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/evolutionaryai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # Redis配置（二级缓存）
  data:
    redis:
      host: localhost
      port: 6379
      password: # 如果Redis有密码,请在此处填写
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  # RabbitMQ配置（消息队列）
  rabbitmq:
    host: localhost
    port: 5672
    username: root
    password: 12345678
    virtual-host: /
    connection-timeout: 60000
    # 消息确认模式: none(无确认), auto(自动确认), manual(手动确认)
    acknowledge-mode: auto
    # 消费者并发配置
    concurrency: 3
    max-concurrency: 10
    prefetch: 1
    # 消息重试配置
    retry-enabled: true
    retry-initial-interval: 1000
    retry-max-interval: 10000
    retry-multiplier: 2.0
    retry-max-attempts: 3
    # 生产者确认配置
    publisher-confirm-type: correlated
    publisher-returns: true
  # Elasticsearch配置（全文搜索引擎）
  elasticsearch:
    host: localhost
    port: 9200
    username: # Elasticsearch用户名（可选）
    password: # Elasticsearch密码（可选）
    connection-timeout: 5000
    socket-timeout: 30000
    max-connections: 100
    max-connections-per-route: 20
    index-prefix: evolutionary_ai
    ssl-enabled: false
    basic-auth-enabled: false
  ai:
    openai:
      #API密钥，建议生产环境使用环境变量 ${OPENAI_API_KEY}
      api-key: sk-c5b4bf6d8f3245eda4b70710c011430e
      #API基础地址，可替换为OpenAI兼容服务商地址（如DeepSeek、通义千问等）
      base-url: https://api.deepseek.com
      chat:
        options:
          #模型名称，根据服务商提供的模型名填写
          model: deepseek-v4-pro
          #温度参数，值越高回复越随机，值越低回复越确定
          temperature: 0.7
    vectors tore:
      milvus:
        client:
          host: localhost
          port: 19530
          username: root
          password: milvus
        database-name: default
        collection-name: evolutionary_ai_vectors
        embedding-dimension: 1536
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.evolutionary_ai_model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: Y2VsbC1ldm9sdXRpb25hcnktYWktbW9kZWwtc2VjcmV0LWtleS0yMDI0
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# MinIO对象存储配置
minio:
  endpoint: http://127.0.0.1:9005
  access-key: root
  secret-key: 12345678
  bucket-name: evolutionary-ai

