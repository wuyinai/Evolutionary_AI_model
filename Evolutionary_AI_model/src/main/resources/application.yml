server:
  port: 8234

spring:
  application:
    name: Evolutionary_AI_model
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/evolutionaryai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.evolutionary_ai_model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: Y2VsbC1ldm9sdXRpb25hcnktYWktbW9kZWwtc2VjcmV0LWtleS0yMDI0
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "
