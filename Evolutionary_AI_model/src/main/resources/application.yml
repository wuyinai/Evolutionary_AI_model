server:
  port: 8234

spring:
  application:
    name: Evolutionary_AI_model
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/evolutionaryai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # Redis配置（二级缓存）
  data:
    redis:
      host: localhost
      port: 6379
      password: # 如果Redis有密码，请在此处填写
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  ai:
    openai:
      #API密钥，建议生产环境使用环境变量 ${OPENAI_API_KEY}
      api-key: sk-c5b4bf6d8f3245eda4b70710c011430e
      #API基础地址，可替换为OpenAI兼容服务商地址（如DeepSeek、通义千问等）
      base-url: https://api.deepseek.com
      chat:
        options:
          #模型名称，根据服务商提供的模型名填写
          model: deepseek-v4-pro
          #温度参数，值越高回复越随机，值越低回复越确定
          temperature: 0.7

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.evolutionary_ai_model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: Y2VsbC1ldm9sdXRpb25hcnktYWktbW9kZWwtc2VjcmV0LWtleS0yMDI0
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "
